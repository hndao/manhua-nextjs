<svg width="768" height="1450" viewBox="0 0 768 1450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1{font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#333}
    .h2{font-family:Arial,sans-serif;font-size:15px;font-weight:bold;fill:#333}
    .label{font-family:Arial,sans-serif;font-size:12px;fill:#555}
    .small{font-family:Arial,sans-serif;font-size:11px;fill:#777}
    .chip{fill:#F5F5F5;stroke:#CCCCCC}
    .btn{fill:#FFFFFF;stroke:#333333}
  </style>
  <rect width="768" height="1450" fill="#F7F7F7"/>

  <!-- Header -->
  <rect x="0" y="0" width="768" height="64" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="24" y="40" class="small">←</text>
  <text x="384" y="40" text-anchor="middle" class="h1">历史记录 / History</text>

  <!-- Toolbar -->
  <rect x="24" y="80" width="720" height="56" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <rect x="40" y="94" width="170" height="28" class="chip" rx="14"/>
  <text x="55" y="112" class="small">最近30天 ▼</text>
  <rect x="220" y="94" width="170" height="28" class="chip" rx="14"/>
  <text x="235" y="112" class="small">最近阅读 ▼</text>
  <rect x="580" y="90" width="80" height="36" class="btn" rx="18"/>
  <text x="606" y="112" class="small">清空</text>
  <rect x="670" y="90" width="74" height="36" fill="#F5F5F5" stroke="#CCCCCC" rx="18"/>
  <text x="690" y="112" class="small">管理</text>

  <!-- List -->
  <rect x="24" y="150" width="720" height="1250" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <text x="44" y="190" class="h2">今天</text>

  <rect x="44" y="210" width="680" height="100" fill="#FFFFFF" stroke="#EEEEEE" rx="10"/>
  <rect x="60" y="222" width="64" height="80" fill="#FFFFFF" stroke="#CCCCCC" rx="6"/>
  <text x="136" y="244" class="label">Title A</text>
  <text x="136" y="264" class="small">读到: 第 128 话 • 进度 65%</text>
  <rect x="580" y="240" width="130" height="40" class="btn" rx="20"/>
  <text x="615" y="265" class="small">继续阅读</text>

  <rect x="44" y="320" width="680" height="100" fill="#FFFFFF" stroke="#EEEEEE" rx="10"/>
  <rect x="60" y="332" width="64" height="80" fill="#FFFFFF" stroke="#CCCCCC" rx="6"/>
  <text x="136" y="354" class="label">Title B</text>
  <text x="136" y="374" class="small">读到: 第 66 话 • 进度 20%</text>
  <rect x="580" y="350" width="130" height="40" class="btn" rx="20"/>
  <text x="615" y="375" class="small">继续阅读</text>

  <text x="44" y="470" class="h2">昨天</text>
  <text x="44" y="500" class="small">... more rows ...</text>
</svg>