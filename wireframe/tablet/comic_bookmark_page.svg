<svg width="768" height="1500" viewBox="0 0 768 1500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1{font-family:Arial,sans-serif;font-size:18px;font-weight:bold;fill:#333}
    .h2{font-family:Arial,sans-serif;font-size:15px;font-weight:bold;fill:#333}
    .small{font-family:Arial,sans-serif;font-size:11px;fill:#777}
    .chip{fill:#F5F5F5;stroke:#CCCCCC}
    .btn{fill:#FFFFFF;stroke:#333333}
  </style>
  <rect width="768" height="1500" fill="#F7F7F7"/>

  <!-- Header -->
  <rect x="0" y="0" width="768" height="64" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="24" y="40" class="small">←</text>
  <text x="384" y="40" text-anchor="middle" class="h1">书架 / Bookmarks</text>
  <text x="720" y="40" class="small">管理</text>

  <!-- Toolbar -->
  <rect x="24" y="80" width="720" height="56" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <rect x="40" y="94" width="170" height="28" class="chip" rx="14"/><text x="55" y="112" class="small">分组: 全部 ▼</text>
  <rect x="220" y="94" width="170" height="28" class="chip" rx="14"/><text x="235" y="112" class="small">排序: 最近 ▼</text>
  <rect x="600" y="90" width="140" height="36" class="btn" rx="18"/><text x="634" y="112" class="small">新建分组</text>

  <!-- Grid 3 columns -->
  <rect x="24" y="150" width="720" height="1300" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>

  <rect x="44" y="170" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="54" y="445" class="small">Title 1</text>
  <rect x="279" y="170" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="289" y="445" class="small">Title 2</text>
  <rect x="514" y="170" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="524" y="445" class="small">Title 3</text>

  <rect x="44" y="480" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="54" y="755" class="small">Title 4</text>
  <rect x="279" y="480" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="289" y="755" class="small">Title 5</text>
  <rect x="514" y="480" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="524" y="755" class="small">Title 6</text>

  <rect x="294" y="1400" width="180" height="40" fill="#FFFFFF" stroke="#333333" rx="20"/>
  <text x="384" y="1425" text-anchor="middle" class="small">加载更多</text>
</svg>