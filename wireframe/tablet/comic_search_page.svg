<svg width="768" height="1600" viewBox="0 0 768 1600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1 { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
    .h2 { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #333; }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
    .small { font-family: Arial, sans-serif; font-size: 11px; fill: #777; }
    .chip { fill:#F5F5F5; stroke:#CCCCCC; }
    .active { fill:#FFFFFF; stroke:#333333; }
  </style>

  <rect width="768" height="1600" fill="#F7F7F7"/>

  <!-- Header -->
  <rect x="0" y="0" width="768" height="64" fill="#FFFFFF" stroke="#DDDDDD"/>
  <rect x="24" y="16" width="110" height="32" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="36" y="37" class="small">LOGO</text>

  <!-- Search -->
  <rect x="150" y="16" width="470" height="32" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="162" y="37" class="small">Search...</text>
  <rect x="632" y="16" width="110" height="32" fill="#FFFFFF" stroke="#333333" rx="8"/>
  <text x="668" y="37" class="small">搜索</text>

  <!-- Title -->
  <text x="24" y="110" class="h1">搜索 / Search</text>

  <!-- Chips row (type + key filters) -->
  <rect x="24" y="120" width="720" height="56" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <rect x="40" y="134" width="72" height="28" class="active" rx="14"/>
  <text x="60" y="153" class="small">漫画</text>
  <rect x="120" y="134" width="72" height="28" class="chip" rx="14"/>
  <text x="140" y="153" class="small">作者</text>
  <rect x="200" y="134" width="72" height="28" class="chip" rx="14"/>
  <text x="220" y="153" class="small">标签</text>

  <rect x="320" y="134" width="110" height="28" class="chip" rx="14"/>
  <text x="345" y="153" class="small">状态 ▼</text>
  <rect x="440" y="134" width="110" height="28" class="chip" rx="14"/>
  <text x="465" y="153" class="small">题材 ▼</text>
  <rect x="560" y="134" width="184" height="28" class="chip" rx="14"/>
  <text x="585" y="153" class="small">排序: 热度 ▼</text>

  <!-- Results container -->
  <rect x="24" y="190" width="720" height="1340" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <text x="44" y="225" class="h2">Results</text>
  <text x="44" y="248" class="small">About 12,345 results</text>

  <!-- Grid 3 columns -->
  <!-- Row 1 -->
  <rect x="44" y="270" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="54" y="545" class="small">Title 1</text>
  <rect x="279" y="270" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="289" y="545" class="small">Title 2</text>
  <rect x="514" y="270" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="524" y="545" class="small">Title 3</text>

  <!-- Row 2 -->
  <rect x="44" y="580" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="54" y="855" class="small">Title 4</text>
  <rect x="279" y="580" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="289" y="855" class="small">Title 5</text>
  <rect x="514" y="580" width="210" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="524" y="855" class="small">Title 6</text>

  <!-- Load more -->
  <rect x="294" y="1460" width="180" height="40" fill="#FFFFFF" stroke="#333333" rx="20"/>
  <text x="384" y="1485" text-anchor="middle" class="small">加载更多</text>
</svg>