<svg width="1440" height="1700" viewBox="0 0 1440 1700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1{font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#333}
    .h2{font-family:Arial,sans-serif;font-size:16px;font-weight:bold;fill:#333}
    .label{font-family:Arial,sans-serif;font-size:13px;fill:#555}
    .small{font-family:Arial,sans-serif;font-size:12px;fill:#777}
    .chip{fill:#F5F5F5;stroke:#CCCCCC}
    .btn{fill:#FFFFFF;stroke:#333333}
    .muted{fill:#F5F5F5;stroke:#CCCCCC}
  </style>

  <rect width="1440" height="1700" fill="#F7F7F7"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#DDDDDD"/>
  <rect x="40" y="20" width="110" height="40" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="55" y="46" class="small">LOGO</text>
  <text x="190" y="50" class="label">首页</text>
  <text x="240" y="50" class="label">排行榜</text>
  <text x="310" y="50" class="label">分类</text>
  <text x="360" y="50" class="label">书架</text>

  <text x="40" y="130" class="h1">历史记录 / History</text>

  <!-- Toolbar -->
  <rect x="40" y="150" width="1360" height="60" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <rect x="60" y="165" width="160" height="30" class="chip" rx="15"/>
  <text x="80" y="185" class="small">范围: 最近30天 ▼</text>
  <rect x="240" y="165" width="160" height="30" class="chip" rx="15"/>
  <text x="260" y="185" class="small">排序: 最近阅读 ▼</text>

  <rect x="1120" y="162" width="120" height="36" class="btn" rx="18"/>
  <text x="1152" y="185" class="small">清空</text>
  <rect x="1260" y="162" width="120" height="36" class="muted" rx="18"/>
  <text x="1292" y="185" class="small">管理</text>

  <!-- List -->
  <rect x="40" y="230" width="1360" height="1380" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>

  <!-- Date group -->
  <text x="60" y="270" class="h2">今天</text>

  <!-- Row 1 -->
  <rect x="60" y="290" width="1320" height="110" fill="#FFFFFF" stroke="#EEEEEE" rx="10"/>
  <rect x="80" y="305" width="70" height="90" fill="#FFFFFF" stroke="#CCCCCC" rx="6"/>
  <text x="165" y="330" class="label">Title A</text>
  <text x="165" y="350" class="small">读到: 第 128 话</text>
  <text x="165" y="370" class="small">进度: 65% • 10:30</text>
  <rect x="1200" y="330" width="160" height="40" class="btn" rx="20"/>
  <text x="1240" y="355" class="small">继续阅读</text>

  <!-- Row 2 -->
  <rect x="60" y="410" width="1320" height="110" fill="#FFFFFF" stroke="#EEEEEE" rx="10"/>
  <rect x="80" y="425" width="70" height="90" fill="#FFFFFF" stroke="#CCCCCC" rx="6"/>
  <text x="165" y="450" class="label">Title B</text>
  <text x="165" y="470" class="small">读到: 第 66 话</text>
  <text x="165" y="490" class="small">进度: 20% • 09:10</text>
  <rect x="1200" y="450" width="160" height="40" class="btn" rx="20"/>
  <text x="1240" y="475" class="small">继续阅读</text>

  <!-- Date group -->
  <text x="60" y="560" class="h2">昨天</text>
  <text x="60" y="590" class="small">... more rows ...</text>
</svg>