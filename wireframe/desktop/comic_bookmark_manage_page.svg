<svg width="1440" height="1750" viewBox="0 0 1440 1750" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1{font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#333}
    .h2{font-family:Arial,sans-serif;font-size:16px;font-weight:bold;fill:#333}
    .label{font-family:Arial,sans-serif;font-size:13px;fill:#555}
    .small{font-family:Arial,sans-serif;font-size:12px;fill:#777}
    .btn{fill:#FFFFFF;stroke:#333333}
    .muted{fill:#F5F5F5;stroke:#CCCCCC}
    .danger{fill:#FFFFFF;stroke:#CC3333}
    .chip{fill:#F5F5F5;stroke:#CCCCCC}
  </style>

  <rect width="1440" height="1750" fill="#F7F7F7"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#DDDDDD"/>
  <rect x="40" y="20" width="110" height="40" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="55" y="46" class="small">LOGO</text>
  <text x="190" y="50" class="label">首页</text>
  <text x="240" y="50" class="label">分类</text>
  <text x="300" y="50" class="label">书架</text>

  <text x="40" y="130" class="h1">书架 / Bookmarks（管理模式）</text>

  <!-- Manage toolbar -->
  <rect x="40" y="150" width="1360" height="60" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <rect x="60" y="170" width="18" height="18" fill="#FFFFFF" stroke="#333333" rx="3"/>
  <text x="88" y="184" class="small">全选</text>
  <text x="160" y="184" class="small">已选: 3</text>

  <!-- Move group -->
  <rect x="820" y="162" width="160" height="36" class="btn" rx="18"/>
  <text x="860" y="185" class="small">移动到分组 ▼</text>

  <!-- Delete -->
  <rect x="990" y="162" width="140" height="36" class="danger" rx="18"/>
  <text x="1030" y="185" class="small" fill="#CC3333">删除所选</text>

  <!-- Create group -->
  <rect x="1140" y="162" width="140" height="36" class="muted" rx="18"/>
  <text x="1175" y="185" class="small">新建分组</text>

  <!-- Done -->
  <rect x="1290" y="162" width="110" height="36" class="btn" rx="18"/>
  <text x="1328" y="185" class="small">完成</text>

  <!-- Grid container -->
  <rect x="40" y="230" width="1360" height="1440" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>

  <!-- Card 1 selected -->
  <rect x="60" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <rect x="70" y="270" width="18" height="18" fill="#FFFFFF" stroke="#333333" rx="3"/>
  <path d="M72 279 L76 283 L83 274" stroke="#333333" stroke-width="2" fill="none"/>
  <text x="70" y="535" class="small">Title 1</text>

  <!-- Card 2 selected -->
  <rect x="270" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <rect x="280" y="270" width="18" height="18" fill="#FFFFFF" stroke="#333333" rx="3"/>
  <path d="M282 279 L286 283 L293 274" stroke="#333333" stroke-width="2" fill="none"/>
  <text x="280" y="535" class="small">Title 2</text>

  <!-- Card 3 selected -->
  <rect x="480" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <rect x="490" y="270" width="18" height="18" fill="#FFFFFF" stroke="#333333" rx="3"/>
  <path d="M492 279 L496 283 L503 274" stroke="#333333" stroke-width="2" fill="none"/>
  <text x="490" y="535" class="small">Title 3</text>

  <!-- Card 4 not selected -->
  <rect x="690" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <rect x="700" y="270" width="18" height="18" fill="#FFFFFF" stroke="#333333" rx="3"/>
  <text x="700" y="535" class="small">Title 4</text>

  <text x="60" y="610" class="small">... more cards with checkboxes ...</text>
</svg>