<svg width="1440" height="1900" viewBox="0 0 1440 1900" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1 { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #333; }
    .h2 { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #555; }
    .small { font-family: Arial, sans-serif; font-size: 12px; fill: #777; }
    .chip { fill:#F5F5F5; stroke:#CCCCCC; }
    .active { fill:#FFFFFF; stroke:#333333; }
  </style>

  <rect width="1440" height="1900" fill="#F7F7F7"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#DDDDDD"/>
  <rect x="40" y="20" width="110" height="40" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="55" y="46" class="small">LOGO</text>
  <text x="190" y="50" class="label">首页</text>
  <text x="240" y="50" class="label">排行榜</text>
  <text x="310" y="50" class="label">分类</text>
  <text x="360" y="50" class="label">漫说</text>

  <!-- Search bar (primary) -->
  <rect x="470" y="20" width="620" height="40" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="485" y="46" class="small">Search comics / authors / tags...</text>
  <rect x="1100" y="20" width="110" height="40" fill="#FFFFFF" stroke="#333333" rx="8"/>
  <text x="1133" y="46" class="small">搜索</text>

  <rect x="1240" y="20" width="160" height="40" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="1285" y="46" class="small">登录</text>

  <!-- Page Title -->
  <text x="40" y="130" class="h1">搜索结果 / Search Results</text>

  <!-- Autocomplete dropdown (optional state) -->
  <rect x="470" y="70" width="620" height="180" fill="#FFFFFF" stroke="#DDDDDD" rx="10" opacity="0.92"/>
  <text x="490" y="100" class="small">Suggestions:</text>
  <text x="490" y="125" class="small">• keyword suggestion 1</text>
  <text x="490" y="150" class="small">• keyword suggestion 2</text>
  <text x="490" y="175" class="small">• comic title suggestion</text>
  <text x="490" y="200" class="small">• author suggestion</text>

  <!-- Content layout: Left filters + Main results + Right sidebar -->
  <!-- LEFT FILTERS -->
  <rect x="40" y="160" width="300" height="1660" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <text x="60" y="200" class="h2">筛选 / Filters</text>

  <!-- Filter: Type -->
  <text x="60" y="240" class="label">类型</text>
  <rect x="60" y="255" width="80" height="28" class="active" rx="14"/>
  <text x="85" y="274" class="small">漫画</text>
  <rect x="150" y="255" width="80" height="28" class="chip" rx="14"/>
  <text x="175" y="274" class="small">作者</text>
  <rect x="240" y="255" width="80" height="28" class="chip" rx="14"/>
  <text x="265" y="274" class="small">标签</text>

  <!-- Filter: Status -->
  <text x="60" y="320" class="label">状态</text>
  <rect x="60" y="335" width="110" height="28" class="chip" rx="14"/>
  <text x="88" y="354" class="small">全部</text>
  <rect x="180" y="335" width="110" height="28" class="chip" rx="14"/>
  <text x="205" y="354" class="small">连载</text>
  <rect x="60" y="370" width="110" height="28" class="chip" rx="14"/>
  <text x="85" y="389" class="small">完结</text>

  <!-- Filter: Genre -->
  <text x="60" y="440" class="label">题材</text>
  <rect x="60" y="455" width="90" height="28" class="chip" rx="14"/>
  <text x="85" y="474" class="small">热血</text>
  <rect x="160" y="455" width="90" height="28" class="chip" rx="14"/>
  <text x="185" y="474" class="small">恋爱</text>
  <rect x="60" y="490" width="90" height="28" class="chip" rx="14"/>
  <text x="85" y="509" class="small">都市</text>
  <rect x="160" y="490" width="90" height="28" class="chip" rx="14"/>
  <text x="185" y="509" class="small">奇幻</text>
  <text x="60" y="545" class="small">... more tags ...</text>

  <!-- Filter: Sort -->
  <text x="60" y="600" class="label">排序</text>
  <rect x="60" y="615" width="240" height="32" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="75" y="636" class="small">综合 / 热度 / 最新 / 评分 ▼</text>

  <!-- Apply / Reset -->
  <rect x="60" y="680" width="110" height="36" fill="#FFFFFF" stroke="#333333" rx="18"/>
  <text x="90" y="703" class="small">应用</text>
  <rect x="190" y="680" width="110" height="36" fill="#F5F5F5" stroke="#CCCCCC" rx="18"/>
  <text x="220" y="703" class="small">重置</text>

  <!-- MAIN RESULTS -->
  <rect x="360" y="160" width="820" height="1660" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <text x="380" y="200" class="h2">结果 / Results</text>

  <!-- Result meta row -->
  <text x="380" y="235" class="small">About 12,345 results • keyword: "xxx"</text>
  <rect x="900" y="215" width="260" height="32" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="915" y="236" class="small">Sort: 热度 ▼</text>

  <!-- Results grid 5 columns -->
  <!-- Row 1 -->
  <rect x="380" y="270" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="388" y="470" class="small">Title 1</text>
  <rect x="540" y="270" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="548" y="470" class="small">Title 2</text>
  <rect x="700" y="270" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="708" y="470" class="small">Title 3</text>
  <rect x="860" y="270" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="868" y="470" class="small">Title 4</text>
  <rect x="1020" y="270" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="1028" y="470" class="small">Title 5</text>

  <!-- Row 2 -->
  <rect x="380" y="520" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="388" y="720" class="small">Title 6</text>
  <rect x="540" y="520" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="548" y="720" class="small">Title 7</text>
  <rect x="700" y="520" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="708" y="720" class="small">Title 8</text>
  <rect x="860" y="520" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="868" y="720" class="small">Title 9</text>
  <rect x="1020" y="520" width="140" height="190" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="1028" y="720" class="small">Title 10</text>

  <!-- Pagination -->
  <rect x="650" y="1750" width="240" height="44" fill="#FFFFFF" stroke="#333333" rx="22"/>
  <text x="770" y="1778" text-anchor="middle" class="small">加载更多 / Load more</text>

  <!-- RIGHT SIDEBAR -->
  <rect x="1200" y="160" width="200" height="1660" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <text x="1220" y="200" class="h2">建议</text>

  <!-- Recent searches -->
  <rect x="1220" y="220" width="160" height="180" fill="#FFFFFF" stroke="#EEEEEE" rx="10"/>
  <text x="1235" y="250" class="label">最近搜索</text>
  <text x="1235" y="275" class="small">• xxx</text>
  <text x="1235" y="295" class="small">• yyy</text>
  <text x="1235" y="315" class="small">• zzz</text>

  <!-- Trending -->
  <rect x="1220" y="420" width="160" height="220" fill="#FFFFFF" stroke="#EEEEEE" rx="10"/>
  <text x="1235" y="450" class="label">热门搜索</text>
  <rect x="1235" y="465" width="60" height="24" class="chip" rx="12"/>
  <text x="1247" y="482" class="small">热血</text>
  <rect x="1300" y="465" width="60" height="24" class="chip" rx="12"/>
  <text x="1312" y="482" class="small">恋爱</text>
  <rect x="1235" y="495" width="60" height="24" class="chip" rx="12"/>
  <text x="1247" y="512" class="small">都市</text>
  <rect x="1300" y="495" width="60" height="24" class="chip" rx="12"/>
  <text x="1312" y="512" class="small">奇幻</text>

  <!-- Footer -->
  <rect x="0" y="1840" width="1440" height="60" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="40" y="1875" class="small">关于我们 | 使用条款 | 隐私政策</text>
</svg>