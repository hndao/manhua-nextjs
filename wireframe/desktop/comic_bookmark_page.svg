<svg width="1440" height="1750" viewBox="0 0 1440 1750" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1{font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#333}
    .h2{font-family:Arial,sans-serif;font-size:16px;font-weight:bold;fill:#333}
    .label{font-family:Arial,sans-serif;font-size:13px;fill:#555}
    .small{font-family:Arial,sans-serif;font-size:12px;fill:#777}
    .chip{fill:#F5F5F5;stroke:#CCCCCC}
    .btn{fill:#FFFFFF;stroke:#333333}
    .muted{fill:#F5F5F5;stroke:#CCCCCC}
  </style>

  <rect width="1440" height="1750" fill="#F7F7F7"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#DDDDDD"/>
  <rect x="40" y="20" width="110" height="40" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="55" y="46" class="small">LOGO</text>
  <text x="190" y="50" class="label">首页</text>
  <text x="240" y="50" class="label">排行榜</text>
  <text x="310" y="50" class="label">分类</text>
  <text x="360" y="50" class="label">书架</text>

  <text x="40" y="130" class="h1">书架 / Bookmarks</text>

  <!-- Toolbar -->
  <rect x="40" y="150" width="1360" height="60" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <rect x="60" y="165" width="160" height="30" class="chip" rx="15"/>
  <text x="78" y="185" class="small">分组: 全部 ▼</text>
  <rect x="240" y="165" width="160" height="30" class="chip" rx="15"/>
  <text x="258" y="185" class="small">排序: 最近收藏 ▼</text>
  <rect x="1120" y="162" width="120" height="36" class="btn" rx="18"/>
  <text x="1148" y="185" class="small">新建分组</text>
  <rect x="1260" y="162" width="120" height="36" class="muted" rx="18"/>
  <text x="1296" y="185" class="small">管理</text>

  <!-- Grid -->
  <rect x="40" y="230" width="1360" height="1440" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>

  <!-- 6 columns cards -->
  <rect x="60" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="70" y="535" class="small">Title 1</text>
  <rect x="270" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="280" y="535" class="small">Title 2</text>
  <rect x="480" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="490" y="535" class="small">Title 3</text>
  <rect x="690" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="700" y="535" class="small">Title 4</text>
  <rect x="900" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="910" y="535" class="small">Title 5</text>
  <rect x="1110" y="260" width="190" height="260" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/>
  <text x="1120" y="535" class="small">Title 6</text>

  <text x="60" y="600" class="small">... more cards ...</text>

  <!-- Load more -->
  <rect x="600" y="1600" width="240" height="44" fill="#FFFFFF" stroke="#333333" rx="22"/>
  <text x="720" y="1628" text-anchor="middle" class="small">加载更多 / Load more</text>
</svg>