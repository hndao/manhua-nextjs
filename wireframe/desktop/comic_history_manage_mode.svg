<svg width="1440" height="1700" viewBox="0 0 1440 1700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1{font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#333}
    .h2{font-family:Arial,sans-serif;font-size:16px;font-weight:bold;fill:#333}
    .label{font-family:Arial,sans-serif;font-size:13px;fill:#555}
    .small{font-family:Arial,sans-serif;font-size:12px;fill:#777}
    .btn{fill:#FFFFFF;stroke:#333333}
    .muted{fill:#F5F5F5;stroke:#CCCCCC}
    .danger{fill:#FFFFFF;stroke:#CC3333}
  </style>

  <rect width="1440" height="1700" fill="#F7F7F7"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#DDDDDD"/>
  <rect x="40" y="20" width="110" height="40" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="55" y="46" class="small">LOGO</text>
  <text x="190" y="50" class="label">首页</text>
  <text x="240" y="50" class="label">分类</text>
  <text x="300" y="50" class="label">书架</text>

  <text x="40" y="130" class="h1">历史记录 / History（管理模式）</text>

  <!-- Toolbar -->
  <rect x="40" y="150" width="1360" height="60" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>

  <!-- Select all -->
  <rect x="60" y="170" width="18" height="18" fill="#FFFFFF" stroke="#333333" rx="3"/>
  <text x="88" y="184" class="small">全选</text>

  <!-- Selected count -->
  <text x="160" y="184" class="small">已选: 2</text>

  <!-- Actions -->
  <rect x="980" y="162" width="140" height="36" class="danger" rx="18"/>
  <text x="1020" y="185" class="small" fill="#CC3333">删除所选</text>

  <rect x="1130" y="162" width="140" height="36" class="muted" rx="18"/>
  <text x="1165" y="185" class="small">清空历史</text>

  <rect x="1280" y="162" width="120" height="36" class="btn" rx="18"/>
  <text x="1318" y="185" class="small">完成</text>

  <!-- List container -->
  <rect x="40" y="230" width="1360" height="1380" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>

  <!-- Date group -->
  <text x="60" y="270" class="h2">今天</text>

  <!-- Row 1 (selected) -->
  <rect x="60" y="290" width="1320" height="110" fill="#FFFFFF" stroke="#EEEEEE" rx="10"/>
  <rect x="80" y="335" width="18" height="18" fill="#FFFFFF" stroke="#333333" rx="3"/>
  <path d="M83 344 L88 349 L96 338" stroke="#333333" stroke-width="2" fill="none"/>
  <rect x="115" y="305" width="70" height="90" fill="#FFFFFF" stroke="#CCCCCC" rx="6"/>
  <text x="200" y="330" class="label">Title A</text>
  <text x="200" y="350" class="small">读到: 第 128 话</text>
  <text x="200" y="370" class="small">进度: 65% • 10:30</text>

  <!-- Row 2 (selected) -->
  <rect x="60" y="410" width="1320" height="110" fill="#FFFFFF" stroke="#EEEEEE" rx="10"/>
  <rect x="80" y="455" width="18" height="18" fill="#FFFFFF" stroke="#333333" rx="3"/>
  <path d="M83 464 L88 469 L96 458" stroke="#333333" stroke-width="2" fill="none"/>
  <rect x="115" y="425" width="70" height="90" fill="#FFFFFF" stroke="#CCCCCC" rx="6"/>
  <text x="200" y="450" class="label">Title B</text>
  <text x="200" y="470" class="small">读到: 第 66 话</text>
  <text x="200" y="490" class="small">进度: 20% • 09:10</text>

  <!-- Row 3 (not selected) -->
  <rect x="60" y="530" width="1320" height="110" fill="#FFFFFF" stroke="#EEEEEE" rx="10"/>
  <rect x="80" y="575" width="18" height="18" fill="#FFFFFF" stroke="#333333" rx="3"/>
  <rect x="115" y="545" width="70" height="90" fill="#FFFFFF" stroke="#CCCCCC" rx="6"/>
  <text x="200" y="570" class="label">Title C</text>
  <text x="200" y="590" class="small">读到: 第 12 话</text>
  <text x="200" y="610" class="small">进度: 5% • 08:20</text>

  <text x="60" y="690" class="h2">昨天</text>
  <text x="60" y="720" class="small">... more rows ...</text>
</svg>