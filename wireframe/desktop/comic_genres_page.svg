<svg width="1440" height="1850" viewBox="0 0 1440 1850" xmlns="http://www.w3.org/2000/svg">
  <style>
    .h1{font-family:Arial,sans-serif;font-size:22px;font-weight:bold;fill:#333}
    .h2{font-family:Arial,sans-serif;font-size:16px;font-weight:bold;fill:#333}
    .label{font-family:Arial,sans-serif;font-size:13px;fill:#555}
    .small{font-family:Arial,sans-serif;font-size:12px;fill:#777}
    .chip{fill:#F5F5F5;stroke:#CCCCCC}
    .active{fill:#FFFFFF;stroke:#333333}
  </style>

  <rect width="1440" height="1850" fill="#F7F7F7"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="80" fill="#FFFFFF" stroke="#DDDDDD"/>
  <rect x="40" y="20" width="110" height="40" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text x="55" y="46" class="small">LOGO</text>
  <text x="190" y="50" class="label">首页</text>
  <text x="240" y="50" class="label">排行榜</text>
  <text x="310" y="50" class="label">分类</text>
  <text x="360" y="50" class="label">漫说</text>
  <rect x="930" y="20" width="320" height="40" fill="#FFFFFF" stroke="#CCCCCC" rx="6"/>
  <text x="945" y="46" class="small">Search...</text>
  <rect x="1270" y="20" width="130" height="40" fill="#FFFFFF" stroke="#CCCCCC" rx="6"/>
  <text x="1305" y="46" class="small">登录</text>

  <text x="40" y="130" class="h1">分类 / Genres</text>

  <!-- Left Filters -->
  <rect x="40" y="150" width="320" height="1600" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <text x="60" y="190" class="h2">筛选 / Filters</text>

  <text x="60" y="230" class="label">题材</text>
  <rect x="60" y="245" width="90" height="28" class="active" rx="14"/><text x="82" y="264" class="small">全部</text>
  <rect x="160" y="245" width="90" height="28" class="chip" rx="14"/><text x="182" y="264" class="small">热血</text>
  <rect x="60" y="280" width="90" height="28" class="chip" rx="14"/><text x="182" y="299" class="small"></text>
  <rect x="160" y="280" width="90" height="28" class="chip" rx="14"/><text x="182" y="299" class="small">恋爱</text>
  <rect x="60" y="315" width="90" height="28" class="chip" rx="14"/><text x="82" y="334" class="small">都市</text>
  <rect x="160" y="315" width="90" height="28" class="chip" rx="14"/><text x="182" y="334" class="small">奇幻</text>
  <text x="60" y="365" class="small">...更多标签...</text>

  <text x="60" y="420" class="label">状态</text>
  <rect x="60" y="435" width="110" height="28" class="active" rx="14"/><text x="92" y="454" class="small">全部</text>
  <rect x="180" y="435" width="110" height="28" class="chip" rx="14"/><text x="212" y="454" class="small">连载</text>
  <rect x="60" y="470" width="110" height="28" class="chip" rx="14"/><text x="92" y="489" class="small">完结</text>

  <text x="60" y="530" class="label">排序</text>
  <rect x="60" y="545" width="260" height="32" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="75" y="566" class="small">热度 / 最新 / 评分 ▼</text>

  <rect x="60" y="610" width="120" height="36" fill="#FFFFFF" stroke="#333333" rx="18"/>
  <text x="95" y="633" class="small">应用</text>
  <rect x="200" y="610" width="120" height="36" fill="#F5F5F5" stroke="#CCCCCC" rx="18"/>
  <text x="235" y="633" class="small">重置</text>

  <!-- Main Content -->
  <rect x="380" y="150" width="1020" height="1600" fill="#FFFFFF" stroke="#DDDDDD" rx="10"/>
  <text x="400" y="190" class="h2">结果 / Comics</text>

  <!-- Sub filter row -->
  <text x="400" y="222" class="small">Genre: 全部 • 12,345 titles</text>
  <rect x="1160" y="205" width="220" height="32" fill="#FFFFFF" stroke="#CCCCCC" rx="8"/>
  <text x="1175" y="226" class="small">Sort: 热度 ▼</text>

  <!-- Grid 6 columns -->
  <!-- Row 1 -->
  <rect x="400" y="250" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="410" y="470" class="small">Title 1</text>
  <rect x="565" y="250" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="575" y="470" class="small">Title 2</text>
  <rect x="730" y="250" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="740" y="470" class="small">Title 3</text>
  <rect x="895" y="250" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="905" y="470" class="small">Title 4</text>
  <rect x="1060" y="250" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="1070" y="470" class="small">Title 5</text>
  <rect x="1225" y="250" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="1235" y="470" class="small">Title 6</text>

  <!-- Row 2 -->
  <rect x="400" y="500" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="410" y="720" class="small">Title 7</text>
  <rect x="565" y="500" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="575" y="720" class="small">Title 8</text>
  <rect x="730" y="500" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="740" y="720" class="small">Title 9</text>
  <rect x="895" y="500" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="905" y="720" class="small">Title 10</text>
  <rect x="1060" y="500" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="1070" y="720" class="small">Title 11</text>
  <rect x="1225" y="500" width="150" height="210" fill="#FFFFFF" stroke="#CCCCCC" rx="10"/><text x="1235" y="720" class="small">Title 12</text>

  <!-- Load more -->
  <rect x="770" y="1700" width="240" height="44" fill="#FFFFFF" stroke="#333333" rx="22"/>
  <text x="890" y="1728" text-anchor="middle" class="small">加载更多 / Load more</text>

  <!-- Footer -->
  <rect x="0" y="1790" width="1440" height="60" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="40" y="1825" class="small">关于我们 | 使用条款 | 隐私政策</text>
</svg>