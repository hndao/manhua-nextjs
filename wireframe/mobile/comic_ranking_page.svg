<svg width="375" height="1500" viewBox="0 0 375 1500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
    .small { font-family: Arial, sans-serif; font-size: 11px; fill: #777; }
    .rank { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #FF7A00; }
  </style>

  <rect width="375" height="1500" fill="#F7F7F7"/>

  <!-- Header -->
  <rect x="0" y="0" width="375" height="56" fill="#FFFFFF" stroke="#DDDDDD"/>
  <text x="12" y="34" class="small">←</text>
  <text x="188" y="34" text-anchor="middle" class="title">排行榜 / Ranking</text>

  <!-- Tabs (scrollable) -->
  <rect x="0" y="56" width="375" height="48" fill="#FFFFFF" stroke="#DDDDDD"/>

  <rect x="12" y="66" width="72" height="28" fill="#FFFFFF" stroke="#333333" rx="14"/>
  <text x="30" y="85" class="small">综合榜</text>

