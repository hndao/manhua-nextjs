  <text x="280" y="130" class="small">排序: 人气 ▼</text>

  <!-- Ranking List -->
  <rect x="0" y="144" width="375" height="1200" fill="#FFFFFF" stroke="#DDDDDD"/>

  <!-- Rank Item 1 -->
  <rect x="12" y="156" width="351" height="92" fill="#FFFFFF" stroke="#EEEEEE" rx="8"/>
  <text x="24" y="212" class="rank">1</text>
  <rect x="52" y="168" width="64" height="80" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="124" y="188" class="label">漫画标题 Title 1</text>
  <text x="124" y="208" class="small">人气 1.2亿 · 更新至 128 话</text>

  <!-- Rank Item 2 -->
  <rect x="12" y="256" width="351" height="92" fill="#FFFFFF" stroke="#EEEEEE" rx="8"/>
  <text x="24" y="312" class="rank">2</text>
  <rect x="52" y="268" width="64" height="80" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="124" y="288" class="label">漫画标题 Title 2</text>
  <text x="124" y="308" class="small">人气 9800万 · 更新至 96 话</text>

  <!-- Rank Item 3 -->
  <rect x="12" y="356" width="351" height="92" fill="#FFFFFF" stroke="#EEEEEE" rx="8"/>
  <text x="24" y="412" class="rank">3</text>
  <rect x="52" y="368" width="64" height="80" fill="#FFFFFF" stroke="#CCCCCC" rx="4"/>
  <text x="124" y="388" class="label">漫画标题 Title 3</text>
  <text x="124" y="408" class="small">人气 8500万 · 更新至 110 话</text>

  <!-- Load more -->
